# Builds the Windows installer of StarLight from the code in the repository.
#
# Started by hand from the Actions tab ("Run workflow"): published versions
# are always built here, never on a personal computer, so that anyone can
# check that the installer comes from this code.
#
# The result (installer, blockmap and the update channel files) is attached
# to the run as an artifact; tools/publish.mjs --skip-build --folder=<that
# folder> then uploads exactly those files.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Windows runners convert line endings on checkout: keep the files
      # byte for byte as they are in the repository.
      - name: Keep line endings as in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Same steps as a real publication (quick checks, attribution, release
      # notes, credits, installer with the update files), without uploading.
      - name: Build the installer
        run: node tools/publish.mjs --dry-run

      # The build regenerates a few files (credits, release notes, language
      # index): if any of them differs, the repository is not up to date
      # and the installer would not match the published code.
      - name: Check that the build matches the repository
        shell: bash
        run: |
          git status --porcelain
          git diff --exit-code

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # tools/publish.mjs places the release tag on this commit.
      - name: Record the commit
        shell: bash
        run: echo "$GITHUB_SHA" > dist-build/build-commit.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: StarLight-${{ steps.version.outputs.version }}
          path: |
            dist-build/StarLight-Installer-${{ steps.version.outputs.version }}.exe
            dist-build/StarLight-Installer-${{ steps.version.outputs.version }}.exe.blockmap
            dist-build/*.yml
            dist-build/build-commit.txt
            !dist-build/builder-debug.yml
          if-no-files-found: error
          retention-days: 30
